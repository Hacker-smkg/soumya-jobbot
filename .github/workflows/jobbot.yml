name: JobBot

on:
  workflow_dispatch:
    inputs:
      send_update:
        description: "Send the Telegram update message"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: jobbot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check jobs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_UPDATE: ${{ inputs.send_update || 'false' }}
        run: python bot.py

      - name: Persist seen jobs
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- seen_jobs.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_jobs.json
            git commit -m "chore: update seen jobs [skip ci]"
            git push
          fi
